name: CI
on:
  workflow_dispatch:
env:
  DB_PASSWORD: FAKE-PW-123
  NODE_VERSION: "20"
jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test
